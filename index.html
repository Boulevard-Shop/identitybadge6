<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identity Badge</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Libre Baskerville (serif title), Cinzel (EMAAR MISR brand), Inter (UI text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            title: ['"Libre Baskerville"', 'Georgia', 'serif'],
            brand: ['Cinzel', 'Times New Roman', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f0f0ef;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Clean off-white paper canvas matching the reference screenshot */
    .badge-bg {
    /* Darker charcoal grey Open Gate button (#5a5b5d) with subtle tactile press & countdown transitions */
    .gate-btn {
      background-color: #5a5b5d;
      transition: background-color 0.25s ease, transform 0.12s ease, box-shadow 0.25s ease;
    }

    .gate-btn:hover {
      background-color: #737578;
    }

    .gate-btn:active {
      background-color: #737578;
      transform: scale(0.988);
    }

    .gate-btn.is-counting {
      background-color: #737578;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .gate-btn.is-opened {
      background-color: #5ea856;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-[#181818] antialiased p-0 sm:p-4">

  <!-- Mobile Container Wrapper (400px frame with 18px horizontal padding -> 364px inner width) -->
  <div class="w-full max-w-[400px] badge-bg min-h-[844px] sm:rounded-[44px] shadow-2xl flex flex-col items-center justify-start overflow-hidden relative border border-gray-200/70 px-[18px] pt-[62px] pb-10">

    <!-- Top Block: Title + Overlapping Avatar + 3 Stacked Card Boxes -->
    <div class="w-full flex flex-col items-center">

      <!-- Exact Serif Title ("Identity Badge" with capital I) -->
      <h1 class="font-title font-bold text-[24px] text-[#1c1c1e] tracking-[-0.015em] leading-none text-center mb-[28px]">
        Identity Badge
      </h1>

      <!-- Unified Card Stack (364px total width) -->
      <div class="w-full relative flex flex-col items-center">

        <!-- Circular Profile Image (274px diameter, 5.5px #6be062 border, overlaps 114px into the 122px top grey box) -->
        <div class="relative z-10 w-[274px] h-[274px] rounded-full border-[5.5px] border-[#6be062] overflow-hidden bg-[#1e1e1e] -mb-[114px]">
          <img 
            src="https://instasize.com/api/image/87b86595e7cab8b705bc41ccda4caee97eebce847446d569df2a37d97308b5c2.jpeg"
            alt="Yousef Walid" 
            class="w-full h-full object-cover object-center"
            onerror="this.src='https://placehold.co/274x274/1e1e1e/ffffff?text=YW'"
          />
        </div>

        <!-- 3 Middle Stacked Card Sections (exact 364px width matching Open Gate button) -->
        <div class="w-full rounded-[20px] overflow-hidden flex flex-col">

          <!-- Box 1: Top light-grey backing behind lower half of circular photo (122px tall, leaves 8px gap below green ring) -->
          <div class="w-full h-[122px] bg-[#eceef2] rounded-t-[20px]"></div>
          
          <!-- Box 2: Middle light-green Username & Type strip (68px tall) -->
          <div class="w-full h-[68px] bg-[#a9e4a3] px-[22px] py-[13px] flex justify-between items-center">
            <div class="flex flex-col">
              <span class="text-[13.5px] text-[#3a5538] font-normal leading-tight">Username</span>
              <span class="text-[17.5px] font-semibold text-[#141414] leading-snug tracking-[-0.01em] mt-[2px]">Yousef Walid</span>
            </div>
            <div class="flex flex-col items-end">
              <span class="text-[13.5px] text-[#3a5538] font-normal leading-tight">Type</span>
              <span class="text-[17.5px] font-semibold text-[#141414] leading-snug tracking-[-0.01em] mt-[2px]">Resident</span>
            </div>
          </div>

          <!-- Box 3: Bottom light-grey Unit & Circular Seal Section (86px tall) -->
          <div class="w-full h-[86px] bg-[#eceef2] rounded-b-[20px] px-[22px] py-[18px] flex justify-between items-center">
            <div class="flex flex-col pr-2">
              <span class="text-[13.5px] text-[#5f6368] font-normal leading-tight">Unit</span>
              <span class="text-[17.5px] font-semibold text-[#141414] leading-snug tracking-[-0.01em] mt-[2px]">Boulevard Residence 2-C-3-3</span>
            </div>
            
            <!-- 42px x 42px Circular Seal Emblem Button (opens Resident Access QR) -->
            <button 
              onclick="toggleQRModal()" 
              aria-label="Show Resident Access QR Code"
              title="Tap to view Resident Access QR"
              class="w-[42px] h-[42px] rounded-full bg-[#f4f5f7] border border-[#dcdde2] flex flex-col items-center justify-center gap-[2.5px] active:scale-95 transition-transform cursor-pointer shrink-0">
              <span class="w-[19px] h-[1.5px] bg-[#6c6e73] rounded-full block"></span>
              <span class="w-[15px] h-[1.5px] bg-[#6c6e73] rounded-full block"></span>
            </button>
          </div>

        </div>

      </div>

      <!-- Open Gate Button (exact same 364px width as the 3-box card, 50px height, 22px below Box 3) -->
      <button 
        id="openGateBtn"
        onclick="startInButtonCountdown()" 
        class="gate-btn w-full text-white font-normal text-[16.5px] tracking-[-0.005em] h-[50px] rounded-[12px] mt-[22px] cursor-pointer flex items-center justify-center">
        <span id="btnText">Open Gate</span>
      </button>

      <!-- Fine Warning Text (18px below Open Gate button) -->
      <p class="text-[13.5px] text-center text-[#3a3a3c] font-normal px-2 mt-[18px] leading-[1.35]">
        Any proven manipulation of this identity will result in a<br>
        EGP 30,000 fine and user suspension.
      </p>

      <!-- Footer EMAAR MISR Logo (44px below fine warning text) -->
      <div class="text-center flex flex-col items-center mt-[44px]">
        <span class="font-brand text-[26px] font-normal tracking-[0.12em] text-[#383838] leading-none uppercase">EMAAR</span>
        <span class="font-sans text-[10px] tracking-[0.28em] text-[#5a5a5a] font-medium mt-[3px] uppercase pl-[0.28em]">MISR</span>
      </div>

    </div>

    <!-- Resident Access QR Code Modal -->
    <div id="qrModal" onclick="handleBackdropClick(event)" class="hidden absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-6 backdrop-blur-xs">
      <div class="w-[280px] bg-white rounded-[22px] p-6 shadow-2xl flex flex-col items-center text-center border border-gray-100">
        <h3 class="text-[18px] font-semibold text-black mb-1">Resident Access QR</h3>
        <p class="text-[12px] text-gray-500 mb-4">Scan at gate scanner for entry</p>

        <div class="p-3 bg-white rounded-2xl shadow-xs mb-4 border border-gray-100">
          <img 
            src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=EMAAR_BOULEVARD_2C33_YOUSEF_WALID" 
            alt="Resident QR Code" 
            class="w-44 h-44 object-contain"
            onerror="this.src='https://placehold.co/180x180/ffffff/111111?text=QR+CODE'"
          >
        </div>

        <button onclick="toggleQRModal()" class="w-full bg-[#5a5b5d] active:bg-[#737578] text-white font-medium py-2.5 rounded-xl text-[15px] transition-colors cursor-pointer">
          Done
        </button>
      </div>
    </div>

  </div>

  <script>
    let isCountingDown = false;
    let countdownTimer = null;

    /**
     * Triggers a 5-second countdown inside the Open Gate button,
     * displays "Gate Opened!" upon completion, and resets cleanly.
     */
    function startInButtonCountdown() {
      if (isCountingDown) return;
      isCountingDown = true;

      const btn = document.getElementById('openGateBtn');
      const btnText = document.getElementById('btnText');
      if (!btn || !btnText) return;

      let count = 5;
      btn.classList.add('is-counting', 'cursor-not-allowed');
      btnText.textContent = `Opening gate in ${count}...`;

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          btnText.textContent = `Opening gate in ${count}...`;
        } else {
          clearInterval(countdownTimer);
          btn.classList.remove('is-counting');
          btn.classList.add('is-opened');
          btnText.textContent = "Gate Opened!";

          setTimeout(() => {
            btnText.textContent = "Open Gate";
            btn.classList.remove('is-opened', 'cursor-not-allowed');
            isCountingDown = false;
          }, 2000);
        }
      }, 1000);
    }

    /**
     * Toggles visibility of the Resident Access QR modal.
     */
    function toggleQRModal() {
      const qrModal = document.getElementById('qrModal');
      if (qrModal) {
        qrModal.classList.toggle('hidden');
      }
    }

    /**
     * Closes the QR modal when tapping outside the modal card.
     */
    function handleBackdropClick(event) {
      if (event.target && event.target.id === 'qrModal') {
        toggleQRModal();
      }
    }
  </script>
</body>
</html>
