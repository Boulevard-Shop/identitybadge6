<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identity Badge</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Libre Baskerville (serif title), Cinzel (EMAAR MISR brand), Inter (UI text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            title: ['"Libre Baskerville"', 'Georgia', 'serif'],
            brand: ['Cinzel', 'Times New Roman', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #ececec;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Clean warm off-white app canvas matching Picture 1 (#f6f6f4) */
    .badge-bg {
      background-color: #f6f6f4;
    }

    /* Darker charcoal grey Open Gate button (#57585a) with subtle tactile press & countdown transitions */
    .gate-btn {
      background-color: #57585a;
      transition: background-color 0.25s ease, transform 0.12s ease, box-shadow 0.25s ease;
    }

    .gate-btn:hover {
      background-color: #6b6c6f;
    }

    .gate-btn:active {
      background-color: #6b6c6f;
      transform: scale(0.988);
    }

    .gate-btn.is-counting {
      background-color: #6b6c6f;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .gate-btn.is-opened {
      background-color: #5ea856;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-[#181818] antialiased p-0 sm:p-4">

  <!-- Mobile Container Wrapper (400px frame with 16px horizontal padding -> 368px inner width) -->
  <div class="w-full max-w-[400px] badge-bg min-h-[844px] sm:rounded-[44px] shadow-2xl flex flex-col items-center justify-start overflow-hidden relative border border-gray-200/70 px-[16px] pt-[56px] pb-10">

    <!-- Top Block: Header Row + Overlapping Avatar + 3 Stacked Card Boxes -->
    <div class="w-full flex flex-col items-center">

      <!-- Header Bar with Small Black "<" Back Arrow aligned with Smaller Title -->
      <div class="w-full relative flex items-center justify-center mb-[26px]">
        <button 
          onclick="window.history.back()" 
          aria-label="Go Back"
          class="absolute left-[4px] flex items-center justify-center w-7 h-7 text-[#181818] active:opacity-60 transition-opacity cursor-pointer">
          <svg width="11" height="18" viewBox="0 0 11 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.2 1.8L2 9L9.2 16.2" stroke="#181818" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <h1 class="font-title font-bold text-[19.5px] text-[#1c1c1e] tracking-[-0.015em] leading-none text-center">
          identity Badge
        </h1>
      </div>

      <!-- Unified Card Stack (368px total width) -->
      <div class="w-full relative flex flex-col items-center">

        <!-- Circular Profile Image (286px diameter, 5.5px #6be062 border, leaves clear ~13px gap above Username box) -->
        <div class="relative z-10 w-[286px] h-[286px] rounded-full border-[5.5px] border-[#6be062] overflow-hidden bg-[#1e1e1e] -mb-[122px]">
          <img 
            src="https://instasize.com/api/image/87b86595e7cab8b705bc41ccda4caee97eebce847446d569df2a37d97308b5c2.jpeg"
            alt="Yousef Walid" 
            class="w-full h-full object-cover object-center"
            onerror="this.src='https://placehold.co/286x286/1e1e1e/ffffff?text=YW'"
          />
        </div>

        <!-- 3 Middle Stacked Card Sections (368px width matching Open Gate button) -->
        <div class="w-full rounded-[20px] overflow-hidden flex flex-col">

          <!-- Box 1: Top cool light-grey backing behind lower half of circular photo (135px tall -> 13px clean gap below green border) -->
          <div class="w-full h-[135px] bg-[#edf0f5] rounded-t-[20px]"></div>
          
          <!-- Box 2: Middle pastel-green Username & Type strip (70px tall) -->
          <div class="w-full h-[70px] bg-[#a8e4a3] px-[20px] py-[13px] flex justify-between items-center">
            <div class="flex flex-col">
              <span class="text-[13px] text-[#3a5538] font-normal leading-tight">Username</span>
              <span class="text-[17px] font-semibold text-[#141414] leading-snug tracking-[-0.01em] mt-[2px]">Yousef Walid</span>
            </div>
            <div class="flex flex-col items-end">
              <span class="text-[13px] text-[#3a5538] font-normal leading-tight">Type</span>
              <span class="text-[17px] font-semibold text-[#141414] leading-snug tracking-[-0.01em] mt-[2px]">Resident</span>
            </div>
          </div>

          <!-- Box 3: Bottom cool light-grey Unit & Circular Seal Section (90px tall) -->
          <div class="w-full h-[90px] bg-[#edf0f5] rounded-b-[20px] px-[20px] py-[18px] flex justify-between items-center">
            <div class="flex flex-col pr-2">
              <span class="text-[13px] text-[#5f6368] font-normal leading-tight">Unit</span>
              <span class="text-[17px] font-semibold text-[#141414] leading-snug tracking-[-0.01em] mt-[2px]">Boulevard Residence 2-C-3-3</span>
            </div>
            
            <!-- 42px x 42px Circular Seal Emblem Button (opens Resident Access QR) -->
            <button 
              onclick="toggleQRModal()" 
              aria-label="Show Resident Access QR Code"
              title="Tap to view Resident Access QR"
              class="w-[42px] h-[42px] rounded-full bg-[#f5f7fa] border border-[#dcdfe6] flex flex-col items-center justify-center gap-[2.5px] active:scale-95 transition-transform cursor-pointer shrink-0">
              <span class="w-[19px] h-[1.5px] bg-[#6c6e73] rounded-full block"></span>
              <span class="w-[15px] h-[1.5px] bg-[#6c6e73] rounded-full block"></span>
            </button>
          </div>

        </div>

      </div>

      <!-- Open Gate Button (exact same 368px width as the 3-box card, 52px height, 24px below Box 3) -->
      <button 
        id="openGateBtn"
        onclick="startInButtonCountdown()" 
        class="gate-btn w-full text-white font-normal text-[16.5px] tracking-[-0.005em] h-[52px] rounded-[12px] mt-[24px] cursor-pointer flex items-center justify-center">
        <span id="btnText">Open Gate</span>
      </button>

      <!-- Fine Warning Text (18px below Open Gate button) -->
      <p class="text-[13px] text-center text-[#3a3a3c] font-normal px-2 mt-[18px] leading-[1.35]">
        Any proven manipulation of this identity will result in a<br>
        EGP 30,000 fine and user suspension.
      </p>

      <!-- Footer EMAAR MISR Logo (46px below fine warning text) -->
      <div class="text-center flex flex-col items-center mt-[46px]">
        <span class="font-brand text-[25px] font-normal tracking-[0.12em] text-[#383838] leading-none uppercase">EMAAR</span>
        <span class="font-sans text-[9.5px] tracking-[0.28em] text-[#5a5a5a] font-medium mt-[3px] uppercase pl-[0.28em]">MISR</span>
      </div>

    </div>

    <!-- Resident Access QR Code Modal -->
    <div id="qrModal" onclick="handleBackdropClick(event)" class="hidden absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-6 backdrop-blur-xs">
      <div class="w-[280px] bg-white rounded-[22px] p-6 shadow-2xl flex flex-col items-center text-center border border-gray-100">
        <h3 class="text-[18px] font-semibold text-black mb-1">Resident Access QR</h3>
        <p class="text-[12px] text-gray-500 mb-4">Scan at gate scanner for entry</p>

        <div class="p-3 bg-white rounded-2xl shadow-xs mb-4 border border-gray-100">
          <img 
            src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=EMAAR_BOULEVARD_2C33_YOUSEF_WALID" 
            alt="Resident QR Code" 
            class="w-44 h-44 object-contain"
            onerror="this.src='https://placehold.co/180x180/ffffff/111111?text=QR+CODE'"
          >
        </div>

        <button onclick="toggleQRModal()" class="w-full bg-[#57585a] active:bg-[#6b6c6f] text-white font-medium py-2.5 rounded-xl text-[15px] transition-colors cursor-pointer">
          Done
        </button>
      </div>
    </div>

  </div>

  <script>
    let isCountingDown = false;
    let countdownTimer = null;

    function startInButtonCountdown() {
      if (isCountingDown) return;
      isCountingDown = true;

      const btn = document.getElementById('openGateBtn');
      const btnText = document.getElementById('btnText');
      if (!btn || !btnText) return;

      let count = 5;
      btn.classList.add('is-counting', 'cursor-not-allowed');
      btnText.textContent = `Opening gate in ${count}...`;

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          btnText.textContent = `Opening gate in ${count}...`;
        } else {
          clearInterval(countdownTimer);
          btn.classList.remove('is-counting');
          btn.classList.add('is-opened');
          btnText.textContent = "Gate Opened!";

          setTimeout(() => {
            btnText.textContent = "Open Gate";
            btn.classList.remove('is-opened', 'cursor-not-allowed');
            isCountingDown = false;
          }, 2000);
        }
      }, 1000);
    }

    function toggleQRModal() {
      const qrModal = document.getElementById('qrModal');
      if (qrModal) {
        qrModal.classList.toggle('hidden');
      }
    }

    function handleBackdropClick(event) {
      if (event.target && event.target.id === 'qrModal') {
        toggleQRModal();
      }
    }
  </script>
</body>
</html>
